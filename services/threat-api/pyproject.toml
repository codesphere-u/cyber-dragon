[project]
name = "cyber-dragon-threat-api"
version = "1.0.0"
description = "Cyber Dragon SSRF-free heuristic threat analysis and PII-redacting incident report API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 120
target-version = "py311"
