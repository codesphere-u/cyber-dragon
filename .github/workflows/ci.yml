name: Validate Cyber Dragon
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -r services/threat-api/requirements.txt ruff mypy pytest-cov pip-audit
      - name: Audit API dependencies
        working-directory: services/threat-api
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Lint Threat API
        working-directory: services/threat-api
        run: ruff check .
      - name: Typecheck Threat API
        working-directory: services/threat-api
        run: mypy app
      - name: Test API
        working-directory: services/threat-api
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Scanner unit tests
        run: npm test
      - name: Benchmark suite verification
        run: npm run benchmark
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
  docker-build:
    runs-on: ubuntu-latest
    needs: [api-tests, web-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Threat API Docker image
        run: |
          docker build -t cyber-dragon-threat-api:ci services/threat-api
          docker run --rm cyber-dragon-threat-api:ci python -c "import os, app.main; assert os.geteuid() != 0"
      - name: Build Web Workbench Docker image
        run: docker build -t cyber-dragon-web:ci apps/web
