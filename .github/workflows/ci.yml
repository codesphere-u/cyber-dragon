name: Validate Cyber Dragon
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -r services/threat-api/requirements.txt
      - name: Test API
        working-directory: services/threat-api
        run: python -m pytest -q
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Scanner unit tests
        run: npm test
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
